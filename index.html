<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>G2 Translator Client</title>
  <!-- Even Hub SDK 브리지 (안경 통신용) -->
  <script src="https://cdn.jsdelivr.net/npm/@evenrealities/even_hub_sdk@latest/dist/evenhub.min.js"></script>
  <style>
    body {
      background-color: #0d1117;
      color: #00ff66;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      margin: 0;
      padding: 16px;
      display: flex;
      flex-direction: column;
      height: 100vh;
      box-sizing: border-box;
    }
    header {
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    h1 {
      font-size: 1.1rem;
      margin: 0;
      color: #58a6ff;
    }
    #status {
      font-size: 0.85rem;
      color: #8b949e;
    }
    #output {
      flex: 1;
      background-color: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 14px;
      white-space: pre-wrap;
      word-break: break-all;
      overflow-y: auto;
      font-size: 0.95rem;
      line-height: 1.5;
    }
    .controls {
      margin-top: 12px;
      display: flex;
      gap: 10px;
    }
    button {
      flex: 1;
      padding: 14px;
      font-size: 1rem;
      font-weight: bold;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    #micBtn {
      background-color: #238636;
      color: #ffffff;
    }
    #micBtn.listening {
      background-color: #da3633;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.6; }
      100% { opacity: 1; }
    }
  </style>
</head>
<body>
  <header>
    <h1>G2 HUD Translator</h1>
    <span id="status">대기 중</span>
  </header>

  <div id="output">마이크 버튼을 누르고 외국어로 말씀해 보세요.</div>

  <div class="controls">
    <button id="micBtn" onclick="toggleRecognition()">음성 인식 시작</button>
  </div>

  <script>
    // ==========================================
    // 본인 Render 주소와 비밀번호를 적어주세요
    // ==========================================
    const SERVER_URL = "https://g2-interpreter.onrender.com/translate";
    const APP_TOKEN = "Gx=jdh*07899";

    const micBtn = document.getElementById('micBtn');
    const statusText = document.getElementById('status');
    const outputDiv = document.getElementById('output');

    let recognition = null;
    let isListening = false;

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (!SpeechRecognition) {
      outputDiv.textContent = "[오류] 이 브라우저는 음성인식을 지원하지 않습니다. Chrome 브라우저를 사용해 주세요.";
    } else {
      recognition = new SpeechRecognition();
      recognition.continuous = false;
      recognition.interimResults = false;

      recognition.onstart = () => {
        isListening = true;
        micBtn.textContent = "듣는 중...";
        micBtn.classList.add('listening');
        statusText.textContent = "음성 감지 중...";
      };

      recognition.onend = () => {
        isListening = false;
        micBtn.textContent = "음성 인식 시작";
        micBtn.classList.remove('listening');
        statusText.textContent = "대기 중";
      };

      recognition.onerror = (event) => {
        statusText.textContent = "오류 발생: " + event.error;
      };

      recognition.onresult = async (event) => {
        const spokenText = event.results[0][0].transcript;
        outputDiv.textContent = `[감지된 말] ${spokenText}\n\nAI 번역 및 답변 생성 중...`;
        statusText.textContent = "서버 통신 중...";
        await sendToTranslateServer(spokenText);
      };
    }

    function toggleRecognition() {
      if (!recognition) return;
      if (isListening) {
        recognition.stop();
      } else {
        recognition.start();
      }
    }

    async function sendToTranslateServer(text) {
      try {
        const response = await fetch(SERVER_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "x-app-token": APP_TOKEN
          },
          body: JSON.stringify({ text: text })
        });

        if (!response.ok) {
          throw new Error(`서버 응답 오류 (상태코드: ${response.status})`);
        }

        outputDiv.textContent = "";
        const reader = response.body.getReader();
        const decoder = new TextDecoder("utf-8");

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          const chunk = decoder.decode(value, { stream: true });
          outputDiv.textContent += chunk;
          outputDiv.scrollTop = outputDiv.scrollHeight;
        }

        statusText.textContent = "완료";

        // 번역 완료 후 Even G2 안경 화면으로 전송
        if (window.EvenHub && window.EvenHub.bridge) {
          window.EvenHub.bridge.textContainerUpgrade({
            text: outputDiv.textContent,
            fontSize: 'normal',
            duration: 15000
          });
        }
      } catch (err) {
        outputDiv.textContent = `[통신 오류]\n${err.message}\n(토큰이나 서버 주소를 확인하세요)`;
        statusText.textContent = "실패";
      }
    }
  </script>
</body>
</html>
